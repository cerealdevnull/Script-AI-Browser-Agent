name: Push on master

on:
  push:
    branches:
      - master
  pull_request:
    types: [ 'opened', 'edited', 'reopened', 'synchronize' ]

jobs:
  sign-off:
    name: Signed-off commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every non-merge commit carries Signed-off-by
        run: |
          missing=$(git log --no-merges --format='%H %(trailers:key=Signed-off-by,valueonly,separator=;)' \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | awk 'NF == 1 { print $1 }')
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by (commit with git commit -s):"
            git log --no-walk --oneline $missing
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: jetbrains
      # Ubuntu 24.04 blocks unprivileged user namespaces, so Chrome's sandbox can't start and the launch times out.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        run: xvfb-run ./gradlew test # browser tests launch a headed Chrome
      - name: Shrunk script jar runs through a host-like class loader
        run: xvfb-run ./gradlew scriptJarTest