name: Push on master

on:
  push:
    branches:
      - master
  pull_request:
    types: [ 'opened', 'edited', 'reopened', 'synchronize' ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: jetbrains
      - name: Test
        run: xvfb-run ./gradlew test # browser tests launch a headed Chrome
      - name: Shrunk script jar runs through a host-like class loader
        run: xvfb-run ./gradlew scriptJarTest