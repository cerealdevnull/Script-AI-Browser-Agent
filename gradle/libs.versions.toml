[versions]
# Pinned to the host's kotlin-stdlib (desktop-client ships 2.3.21): the script runs on the host's stdlib.
kotlin = "2.3.21"
shadow = "9.6.1"
proguard = "7.9.1"
cereal-test-utils = "1.13.0"
cereal-sdk = "1.13.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kdriver = "0.6.1"
okhttp = "5.4.0"

[libraries]
cereal-sdk = { module = "com.cereal-automation:cereal-sdk", version.ref = "cereal-sdk" }
cereal-test-utils = { module = "com.cereal-automation:cereal-test-utils", version.ref = "cereal-test-utils" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kdriver-core = { module = "dev.kdriver:core", version.ref = "kdriver" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
proguard-gradle = { module = "com.guardsquare:proguard-gradle", version.ref = "proguard" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
