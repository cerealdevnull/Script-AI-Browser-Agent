<!doctype html>
<!--
  PROTOTYPE, throwaway (wayfinder ticket #16). Not shipped.
  Three variants of the confirmation dialog the script passes to showHtml, switchable via ?variant=A|B|C,
  each shown for three scenarios via ?scenario=1|2|3. Arrow keys cycle variants, number keys pick the scenario.
  Constraints from the SDK research (#7): showHtml opens a SEPARATE Chrome window, ignores the title, has no size or
  timeout, CSS renders, JS is unverified -> every dialog body below works with plain links and <details> only.
  The answer is a navigation to a fake URL (…/confirm, …/decline); the frame here just shows which one you clicked.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmation dialog prototype</title>
<style>
  body { margin: 0; background: #d9dce1; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d1f23; }
  /* mock of the separate Chrome window: the tab shows the raw URL because showHtml ignores the title */
  .win { width: min(760px, calc(100vw - 32px)); margin: 24px auto 120px; background: #fff; border-radius: 10px; box-shadow: 0 8px 30px #0003; overflow: hidden; }
  .chrome { background: #dee1e6; padding: 8px 12px 0; font-size: 12px; color: #444; }
  .tab { display: inline-block; background: #fff; border-radius: 8px 8px 0 0; padding: 6px 14px; max-width: 260px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .bar { background: #fff; padding: 6px 12px; border-bottom: 1px solid #ddd; font-size: 12px; color: #666; }
  .page { min-height: 420px; }
  .note { width: min(760px, calc(100vw - 32px)); margin: 0 auto; font-size: 13px; color: #333; }
  .note b { color: #000; }
  .clicked { background: #fffbe6; border: 1px solid #f0d27a; padding: 10px 14px; margin: 12px; border-radius: 6px; font-size: 13px; }

  /* ---------- Variant A: one plain sentence ---------- */
  .A { padding: 40px 48px; max-width: 560px; margin: 0 auto; }
  .A .app { font-size: 13px; color: #666; letter-spacing: .02em; }
  .A h1 { font-size: 28px; line-height: 1.25; margin: 10px 0 8px; }
  .A .site { font-size: 16px; color: #333; }
  .A .why { margin: 22px 0; padding: 12px 16px; background: #f4f5f7; border-radius: 8px; color: #333; }
  .A .btns { display: flex; gap: 12px; margin-top: 28px; }
  .A .btns a { flex: 1; text-align: center; padding: 14px; border-radius: 10px; font-weight: 600; text-decoration: none; font-size: 16px; }
  .A .no { background: #fff; color: #1d1f23; border: 2px solid #c4c8cf; }
  .A .yes { background: #1a56db; color: #fff; border: 2px solid #1a56db; }
  .A .small { margin-top: 18px; font-size: 13px; color: #666; }

  /* ---------- Variant B: labelled summary card ---------- */
  .B { padding: 28px; }
  .B header { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .B header .dot { width: 10px; height: 10px; border-radius: 50%; background: #e3a008; }
  .B h1 { font-size: 20px; margin: 14px 0 18px; }
  .B dl { display: grid; grid-template-columns: 140px 1fr; gap: 10px 16px; margin: 0; border-top: 1px solid #e5e7eb; padding-top: 16px; }
  .B dt { color: #666; }
  .B dd { margin: 0; }
  .B .typed { font-family: ui-monospace, Menlo, monospace; background: #f4f5f7; padding: 6px 8px; border-radius: 4px; display: inline-block; white-space: pre-wrap; }
  .B details { margin-top: 18px; font-size: 13px; color: #555; }
  .B details code { font-size: 12px; }
  .B .btns { display: grid; gap: 10px; margin-top: 24px; }
  .B .btns a { display: block; text-align: center; padding: 13px; border-radius: 8px; font-weight: 600; text-decoration: none; }
  .B .yes { background: #046c4e; color: #fff; }
  .B .no { background: #fff; color: #9b1c1c; border: 1px solid #f1b4b4; }
  .B .foot { margin-top: 14px; font-size: 12px; color: #666; }
  @media (max-width: 560px) { .B dl { grid-template-columns: 1fr; gap: 2px; } .B dd { margin-bottom: 10px; } }

  /* ---------- Variant C: stop sign, three ways out ---------- */
  .C .banner { background: #9b1c1c; color: #fff; padding: 18px 28px; font-size: 18px; font-weight: 700; }
  .C .banner small { display: block; font-weight: 400; font-size: 13px; opacity: .9; }
  .C .body { padding: 24px 28px; }
  .C .shot { border: 1px dashed #c4c8cf; border-radius: 8px; padding: 18px; text-align: center; background: #fafafa; }
  .C .shot .btnmock { display: inline-block; padding: 9px 18px; background: #ffd814; border: 1px solid #c7a20c; border-radius: 20px; font-weight: 600; }
  .C .shot .cap { margin-top: 8px; font-size: 12px; color: #666; }
  .C ul { padding-left: 18px; }
  .C .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .C .btns a { padding: 12px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  .C .stop { background: #1d1f23; color: #fff; flex: 2; text-align: center; }
  .C .skip { background: #fff; color: #1d1f23; border: 1px solid #c4c8cf; flex: 2; text-align: center; }
  .C .yes { background: #fff; color: #9b1c1c; border: 1px solid #9b1c1c; flex: 1; text-align: center; }
  .C .warn { margin-top: 16px; font-size: 13px; color: #9b1c1c; }

  /* prototype switcher, not part of any design */
  .switch { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; background: #111; color: #fff; border-radius: 999px; padding: 6px 10px; box-shadow: 0 6px 20px #0006; font-size: 13px; z-index: 9; max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center; }
  .switch button { background: #333; color: #fff; border: 0; border-radius: 999px; padding: 6px 10px; cursor: pointer; font: inherit; }
  .switch button.on { background: #fde047; color: #111; }
  .switch .lbl { padding: 0 8px; min-width: 150px; text-align: center; }
</style>
</head>
<body>
<div class="win">
  <div class="chrome"><span class="tab" id="tab"></span></div>
  <div class="bar" id="addr"></div>
  <div class="page" id="page"></div>
</div>
<div class="note" id="note"></div>

<div class="switch">
  <button id="prev" aria-label="Previous variant">◀</button>
  <span class="lbl" id="lbl"></span>
  <button id="next" aria-label="Next variant">▶</button>
  <span style="opacity:.6">|</span>
  <button data-s="1">1 Buy</button><button data-s="2">2 Send</button><button data-s="3">3 Delete (replay)</button>
</div>

<script>
// Everything the script actually has when it asks: Confirmation(action, element, url, reason) + text for `type`,
// plus run state (mode, step, cost, replay). "verb"/"thing" are the plain-words rewrite the variants would need.
const SCENARIOS = {
  1: { goal: "Buy the cheapest pack of AA batteries on Amazon", mode: "Once", replay: false, step: 7, maxSteps: 40, cost: 0.14,
       action: "click", element: 'button "Place your order – $12.49"', url: "https://www.amazon.com/gp/buy/spc/handlers/display.html",
       host: "amazon.com", reason: "This places the order and charges the saved card.", typed: null,
       verb: "Place this order", label: "Place your order – $12.49", money: "$12.49 (read from the button)" },
  2: { goal: "Ask support to cancel my gym membership", mode: "Once", replay: false, step: 12, maxSteps: 40, cost: 0.31,
       action: "type", element: 'textbox "Message"', url: "https://help.basic-fit.com/contact?form=membership",
       host: "basic-fit.com", reason: "Submitting this form sends the message to support.",
       typed: "Hello, please cancel my membership (no. {{secret:member_id}}) at the end of this month. Thank you.",
       verb: "Send this message", label: "Message", money: null },
  3: { goal: "Every day, delete old drafts in my Etsy shop", mode: "Repeat", replay: true, step: 0, maxSteps: 40, cost: 0,
       action: "click", element: 'button "Delete 3 drafts"', url: "https://www.etsy.com/your/shops/me/tools/listings/state:draft",
       host: "etsy.com", reason: null, typed: null,
       verb: "Delete 3 drafts", label: "Delete 3 drafts", money: null },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const usd = n => "$" + n.toFixed(2);
const progress = s => s.replay ? "Replaying a learned run · $0 so far" : `Step ${s.step} of ${s.maxSteps} · ${usd(s.cost)} so far`;

const VARIANTS = {
  // A: one big sentence in the user's words, two equal buttons, the verb on the Yes button. Decline on the left.
  A: { name: "One plain sentence", html: s => `
    <div class="A">
      <div class="app">AI Browser Agent · needs your OK</div>
      <h1>${esc(s.verb)} on ${esc(s.host)}?</h1>
      <div class="site">${s.typed ? `It will send: “${esc(s.typed)}”` : `It will press “${esc(s.label)}”.`}</div>
      <div class="why">${s.reason ? esc(s.reason) : "The agent gave no reason. It flagged this step because the button says “" + esc(s.label) + "”."}</div>
      <div class="btns">
        <a class="no" href="https://cereal-confirm.invalid/decline">No, stop here</a>
        <a class="yes" href="https://cereal-confirm.invalid/confirm">Yes, ${esc(s.verb.toLowerCase())}</a>
      </div>
      <div class="small">Closing this window, or leaving the Tasks screen, counts as No. The task waits until you answer.</div>
    </div>` },

  // B: a labelled summary (what / where / why / stake / spent / if no), safe-looking Yes on top, technical details folded.
  B: { name: "Labelled summary", html: s => `
    <div class="B">
      <header><span class="dot"></span> AI Browser Agent is waiting for you</header>
      <h1>Allow this step?</h1>
      <dl>
        <dt>It will</dt><dd><b>${esc(s.verb)}</b>${s.typed ? `<br><span class="typed">${esc(s.typed)}</span>` : ""}</dd>
        <dt>On</dt><dd>${esc(s.host)}</dd>
        <dt>Why it asks</dt><dd>${s.reason ? esc(s.reason) : "No reason given. The button text looks like a step that can't be undone."}</dd>
        <dt>Amount</dt><dd>${s.money ? esc(s.money) : "None shown on the page"}</dd>
        <dt>Your goal</dt><dd>${esc(s.goal)}</dd>
        <dt>So far</dt><dd>${esc(progress(s))}${s.mode === "Repeat" ? " · Repeat task" : ""}</dd>
        <dt>If you say no</dt><dd>The task stops. Nothing is ${s.typed ? "sent" : "pressed"}.</dd>
      </dl>
      <details><summary>Technical details</summary>
        <p>Action: <code>${esc(s.action)}</code><br>Element: <code>${esc(s.element)}</code><br>Page: <code>${esc(s.url)}</code></p>
      </details>
      <div class="btns">
        <a class="yes" href="https://cereal-confirm.invalid/confirm">Allow: ${esc(s.verb)}</a>
        <a class="no" href="https://cereal-confirm.invalid/decline">Don't allow, stop the task</a>
      </div>
      <div class="foot">No time limit. Closing this window or leaving the Tasks screen = Don't allow.</div>
    </div>` },

  // C: stop-sign framing, the element shown as it looks on the page, three ways out (stop / skip & let it try another
  // way / go ahead). "Skip" is a NEW behaviour to react to: the model is told "the user said no to this", run continues.
  C: { name: "Stop sign, three exits", html: s => `
    <div class="C">
      <div class="banner">Wait: this can't be undone<small>${esc(s.host)} · ${esc(progress(s))}</small></div>
      <div class="body">
        <div class="shot">
          ${s.typed ? `<div style="text-align:left;font-size:13px;white-space:pre-wrap">${esc(s.typed)}</div><div class="cap">This text goes into “${esc(s.label)}” and is sent</div>`
                    : `<span class="btnmock">${esc(s.label)}</span><div class="cap">The agent wants to press this</div>`}
        </div>
        <ul>
          <li>${s.reason ? esc(s.reason) : "No reason given by the agent."}</li>
          ${s.replay ? "<li>This is a replay of steps you allowed before. The page may have changed since.</li>" : ""}
        </ul>
        <div class="btns">
          <a class="stop" href="https://cereal-confirm.invalid/decline">Stop the task</a>
          <a class="skip" href="https://cereal-confirm.invalid/skip">Don't do this, try another way</a>
          <a class="yes" href="https://cereal-confirm.invalid/confirm">Do it</a>
        </div>
        <div class="warn">If you close this window or leave the Tasks screen, the task stops.</div>
      </div>
    </div>` },
};

const keys = Object.keys(VARIANTS);
const q = new URLSearchParams(location.search);
let v = keys.includes(q.get("variant")) ? q.get("variant") : "A";
let sc = SCENARIOS[q.get("scenario")] ? q.get("scenario") : "1";
let clicked = null;

function render() {
  const s = SCENARIOS[sc];
  document.getElementById("tab").textContent = "data:text/html,<!doctype html>…"; // what the user sees: no title
  document.getElementById("addr").textContent = "Separate Chrome window · opened by the AI Browser Agent task";
  document.getElementById("page").innerHTML = VARIANTS[v].html(s) + (clicked ? `<div class="clicked">Clicked → <b>${esc(clicked)}</b></div>` : "");
  document.getElementById("lbl").textContent = `${v} (${VARIANTS[v].name})`;
  document.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("on", b.dataset.s === sc));
  document.getElementById("note").innerHTML =
    `<b>Scenario ${sc}:</b> ${esc(s.goal)} · ${s.mode}${s.replay ? " · replay" : ""}. ` +
    `<b>Raw data today:</b> action=${esc(s.action)}, element=${esc(s.element)}, url=${esc(s.url)}, reason=${esc(s.reason ?? "null")}.`;
  history.replaceState(null, "", `?variant=${v}&scenario=${sc}`);
}
document.getElementById("page").addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault(); clicked = a.href.split("/").pop() + "  (" + a.textContent.trim() + ")"; render();
});
const go = d => { v = keys[(keys.indexOf(v) + d + keys.length) % keys.length]; clicked = null; render(); };
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { sc = b.dataset.s; clicked = null; render(); });
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1);
  else if (SCENARIOS[e.key]) { sc = e.key; clicked = null; render(); }
});
render();
</script>
</body>
</html>
