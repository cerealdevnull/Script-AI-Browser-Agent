<!doctype html>
<html lang="en">
<head><title>Toolshop - Account settings</title></head>
<body>
<h1>Account settings</h1>
<form>
  <label>First name <input type="text" id="first-name"></label>
  <label>Email address <input type="email" id="email"></label>
  <label>Current password <input type="password" id="current-password"></label>
  <label>New password <input type="password" id="new-password"></label>
  <label>Card number <input type="text" autocomplete="cc-number" id="card"></label>
  <button type="submit">Save</button>
</form>
</body>
</html>
